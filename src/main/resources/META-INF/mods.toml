    displayName="${display_name}"
    description="${description}"
    version="${version}"
    displayURL="${display_url}"
    updateJSONURL="https://raw.githubusercontent.com/wendall911/SurvivalistEssentials/${mod_update_branch}/files/updates.json"
    authors="${authors}"
    credits="${credits}"
    itemIcon="survivalistessentials:rock_stone"
    logoFile="${logo_file}"
